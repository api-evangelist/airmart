aid: airmart
name: Airmart
description: Airmart (goairmart.com) is a Redwood City, California e-commerce platform founded in 2018 that lets
  small sellers such as home bakers, farms, restaurants, cottage-food makers, creators and community group buys
  open a link-based online storefront, take orders and payments (Stripe card checkout, PayPal, Venmo, Zelle, cash),
  manage customers and marketing, and fulfil through pickup, shipping, DoorDash on-demand delivery or its own
  route-planned delivery service. Sellers run their shop from my.goairmart.com or the Airmart mobile apps and
  buyers shop at shop.goairmart.com; plans start at a free Basic tier with a Standard plan at $19/month
  ($16/month billed annually). As of this profile Airmart publishes no public developer program, API
  documentation, SDK, webhooks or machine-readable contract; api.goairmart.com and ts-api.goairmart.com are
  private first-party backends for its own web and mobile apps.
